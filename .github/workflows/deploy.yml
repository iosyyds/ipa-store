name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Checkout main into site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          clean: false

      - name: Replace site content with build output
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r out/. site/

      - name: Commit and push to main
        run: |
          cd site
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: deploy static build [skip ci]" || echo "no changes to commit"
          git push origin HEAD:main
