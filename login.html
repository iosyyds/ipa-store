<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://ipa.puaaa.cn; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta name="keywords" content="甜甜IPA登录,IPA下载注册,用户登录,授权码兑换,苹果软件下载账号">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://iosyyds.github.io/ipa-store/login.html">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="甜甜">
<meta property="og:type" content="website">
<meta property="og:site_name" content="甜甜-IPA应用库">
<meta property="og:title" content="登录 / 注册 - 甜甜-IPA应用库">
<meta property="og:description" content="登录或注册后兑换授权码、下载 iOS IPA 应用。">
<meta property="og:url" content="https://iosyyds.github.io/ipa-store/login.html">
<meta property="og:locale" content="zh_CN">
<link rel="stylesheet" href="assets/css/style.css?v=1.2.0">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="mark"><img src="assets/favicon.svg" alt="甜甜-IPA应用库"></span>
      <span>甜甜-IPA应用库</span>
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="login.html" id="userEntry">登录</a>
    </div>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><img src="assets/favicon.svg" alt="甜甜-IPA应用库"></div>
    <h1 id="cardTitle">欢迎回来</h1>
    <p id="cardSub">登录后下载应用、管理授权码</p>

    <div class="seg">
      <button id="tabLogin" class="active" type="button">登录</button>
      <button id="tabReg" type="button">注册</button>
    </div>

    <form id="loginForm">
      <div class="field"><label>账号 / 邮箱</label>
        <input class="input" id="loginAccount" autocomplete="username" required></div>
      <div class="field"><label>密码</label>
        <input class="input" id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登 录</button>
    </form>

    <form id="regForm" hidden>
      <div class="field"><label>用户名（3-10 位字母或数字）</label>
        <input class="input" id="regName" autocomplete="username" pattern="[A-Za-z0-9]{3,10}" required></div>
      <div class="field"><label>昵称（选填，不填则用用户名）</label>
        <input class="input" id="regNick" autocomplete="nickname" maxlength="12"></div>
      <div class="field"><label>邮箱</label>
        <input class="input" id="regEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label>密码（至少 6 位）</label>
        <input class="input" id="regPass" type="password" autocomplete="new-password" required></div>
      <div class="field"><label>确认密码</label>
        <input class="input" id="regPass2" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="regBtn">注 册</button>
    </form>
  </div>
</div>

<nav class="tabbar">
  <a class="tab-item" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    首页</a>
  <a class="tab-item" href="categories.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    分类</a>
  <a class="tab-item active" href="user.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
    我的</a>
</nav>

<script src="assets/js/config.js?v=1.2.0"></script>
<script src="assets/js/api.js?v=1.2.0"></script>
<script src="assets/js/user-auth.js?v=1.2.0"></script>
<script>
const back = new URLSearchParams(location.search).get('redirect') || 'index.html';
const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabReg');
const loginForm = document.getElementById('loginForm');
const regForm = document.getElementById('regForm');

function showLogin() {
  tabLogin.classList.add('active'); tabReg.classList.remove('active');
  loginForm.hidden = false; regForm.hidden = true;
  document.getElementById('cardTitle').textContent = '欢迎回来';
  document.getElementById('cardSub').textContent = '登录后下载应用、管理授权码';
}
function showReg() {
  tabReg.classList.add('active'); tabLogin.classList.remove('active');
  regForm.hidden = false; loginForm.hidden = true;
  document.getElementById('cardTitle').textContent = '创建账号';
  document.getElementById('cardSub').textContent = '注册即可兑换授权码、下载应用';
}
tabLogin.addEventListener('click', showLogin);
tabReg.addEventListener('click', showReg);

/* 注册开关：后台关闭注册后隐藏注册入口，仅保留登录 */
(async () => {
  try {
    const st = await API.settings();
    if (st.register_open === '0') {
      tabReg.style.display = 'none';
      showLogin();
      const hint = document.createElement('div');
      hint.className = 'muted';
      hint.style.cssText = 'font-size:12px;text-align:center;margin-top:14px';
      hint.textContent = '注册已关闭，如需账号请联系管理员';
      document.querySelector('.seg').after(hint);
    }
  } catch (e) { /* 接口异常时保持默认开放 */ }
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    await doLogin({
      account: document.getElementById('loginAccount').value.trim(),
      password: document.getElementById('loginPass').value,
    });
    location.href = back;
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = '登 录';
  }
});

regForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  if (!/^[A-Za-z0-9]{3,10}$/.test(name))
    return toast('用户名需 3-10 位字母或数字', 'error');
  const p1 = document.getElementById('regPass').value;
  if (p1 !== document.getElementById('regPass2').value)
    return toast('两次输入的密码不一致', 'error');
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '注册中…';
  try {
    await doRegister({
      username: name,
      nickname: document.getElementById('regNick').value.trim(),
      email: document.getElementById('regEmail').value.trim(),
      password: p1,
    });
    location.href = back;
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = '注 册';
  }
});
</script>
</body>
</html>
